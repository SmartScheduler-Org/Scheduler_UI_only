{% extends "base.html" %}
{% block content %}

<div class="login-page">

  <canvas id="stars"></canvas>

  <div class="login-blob login-blob-1"></div>
  <div class="login-blob login-blob-2"></div>

  <div class="login-box">
    <div class="login-split">

      <!-- LEFT IMAGE PANEL -->
      <div class="login-left">
        <div class="image-overlay">
          <p class="auto-text"></p>
        </div>

        <!-- TEACHER CLASSROOM IMAGE -->
        <img 
          src="https://images.unsplash.com/photo-1571260899304-425eee4c7efc?w=900&auto=format&fit=crop&q=80"
          class="side-image"
          alt="Teacher Classroom"
        >
      </div>

      <!-- RIGHT SIDE -->
      <div class="login-right">

        <h2 class="login-title">Welcome Teacher 👨‍🏫</h2>
        <p class="login-subtitle">Log in with your name, teacher code &amp; password.</p>

        {% if messages %}
        <div class="tl-alerts">
          {% for message in messages %}
          <div class="tl-alert {% if 'error' in message.tags %}is-error{% else %}is-ok{% endif %}">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %}

        <!-- LOGIN FORM -->
        <form method="post" action="{% url 'teacher/login' %}" class="form">
          {% csrf_token %}
          <p><label>Teacher Name</label>
          <input type="text" name="name" id="username" placeholder="Enter your full name" required></p>

          <p><label>Teacher Code</label>
          <input type="text" name="code" id="t_code" placeholder="Enter your teacher code" required></p>

          <p><label>Password</label>
          <input type="password" name="password" id="password" placeholder="Enter password" required></p>

          <button type="submit" id="loginBtn" class="btn">Login</button>
        </form>

        <div class="links">
          New here? <a href="{% url 'teacher_register' %}">Create your teacher account</a>
        </div>

      </div>
    </div>
  </div>
</div>

<style>
html, body { width:100%; overflow-x:hidden !important; }

:root { --accent:#6366f1; --accent2:#ec4899; --muted:#9ca3af; }

/* Page Layout */
.login-page {
  min-height:calc(100vh - 100px);
  display:flex; justify-content:center; align-items:center;
  padding:10px 0 20px 0;
  position:relative;
  font-family:"Poppins",sans-serif;
}

/* Blobs */
.login-blob { position:absolute; border-radius:999px; filter:blur(60px);
  opacity:.62; mix-blend-mode:screen; z-index:0;}
.login-blob-1{width:340px;height:340px;background:#4f46e5;top:-80px;left:-80px;}
.login-blob-2{width:420px;height:420px;background:#ec4899;bottom:-120px;right:-80px;}

#stars,#wave-canvas{position:fixed; inset:0; width:100vw;height:100vh;pointer-events:none;z-index:0;}

/* CARD */
.login-box {
  z-index:2;
  width:100%; max-width:820px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(14px);
  background:rgba(15,23,42,.55);
  overflow:hidden;
  animation:pop .7s ease forwards; opacity:0; transform:translateY(20px);
}
@keyframes pop {to {opacity:1; transform:translateY(0);}}

/* Split */
.login-split { display:flex; width:100%; }

/* LEFT IMAGE */
.login-left {
  width:45%; position:relative;
}
.side-image {
  width:100%; height:100%; object-fit:cover; display:block;
  border-radius:22px 0 0 22px;
}

/* AUTO TYPE ON IMAGE */
.image-overlay {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:5; text-align:center;
}
.auto-text {
  font-size: 26px;
  font-weight: 700;
  color: white;
  text-shadow: none;
}

/* FORM SIDE */
.login-right { width:55%; padding:24px 28px; }

.login-title {
  font-size:28px; font-weight:800;
  background:linear-gradient(120deg,#a5f3fc,#d8b4fe,#f9a8d4);
  -webkit-background-clip:text; color:transparent;
  letter-spacing:1px;
}

.login-subtitle { font-size:14px; color:var(--muted); margin-bottom:12px; }

/* FORM */
.form p { margin-bottom:10px; text-align:left; font-size:13px; color:var(--muted); }
.form label { margin-bottom:3px; display:block; }
.form input {
  width:100%; padding:10px 12px;
  border-radius:10px; font-size:14px; color:white;
  background:rgba(15,23,42,.9);
  border:1px solid rgba(148,163,184,.45);
}

/* BUTTON */
.btn {
  width:100%; padding:11px; border-radius:999px;
  font-size:16px; font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  cursor:pointer; color:white;
  text-align:center;
}
.btn:hover { transform:translateY(-2px); }

/* DISABLED BUTTON */
.btn.disabled {
  pointer-events: none;
  opacity: 0.5;
  cursor: not-allowed;
}

/* OR DIVIDER */
.or-divider {
  display:flex; align-items:center; gap:12px;
  margin:12px 0 10px;
  color:var(--muted); font-size:13px;
}
.or-divider::before, .or-divider::after {
  content:""; flex:1; height:1px;
  background:rgba(148,163,184,.35);
}

/* GOOGLE BUTTON */
.google-btn {
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; padding:10px; border-radius:999px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(148,163,184,.35);
  color:white; font-size:15px; font-weight:600;
  text-decoration:none; cursor:pointer;
  transition: background .2s;
}
.google-btn:hover { background:rgba(255,255,255,.15); }

/* LINKS */
.links { margin-top:12px; font-size:13px; text-align:center; color:var(--muted); }
.links a { color:#a5b4fc; font-weight:600; }

/* RESPONSIVE */
@media(max-width:768px){
  .login-split { flex-direction:column; }
  .login-left { width:100%; height:230px; }
  .side-image { border-radius:22px 22px 0 0; }
  .login-right { width:100%; padding:22px; }
  .auto-text { font-size:20px; }
  .login-title { font-size:28px; }
}
</style>

<!-- AUTO-TYPE -->
<script>
const messages = [
  "View Your Daily Classes",
  "Track Assigned Lectures",
  "Smart Scheduling for Teachers ✨"
];

let i=0, j=0, speed=70;
const el=document.querySelector(".auto-text");

function type(){
  if(j < messages[i].length){
    el.innerHTML += messages[i][j++];
    setTimeout(type,speed);
  } else setTimeout(erase,1200);
}

function erase(){
  if(j>0){
    el.innerHTML = messages[i].substring(0,--j);
    setTimeout(erase,40);
  } else { i=(i+1)%messages.length; setTimeout(type,300); }
}

type();
</script>

<!-- FLOATING STARS -->
<script>
const s=document.getElementById("stars"),ctx=s.getContext("2d");
function resize(){s.width=innerWidth; s.height=innerHeight} resize(); addEventListener("resize",resize);
class Star{constructor(){
this.x=Math.random()*s.width;this.y=Math.random()*s.height;
this.size=Math.random()*1.8+.6;this.sx=Math.random()*.08-.04;this.sy=Math.random()*.08-.04;}
move(){this.x+=this.sx;this.y+=this.sy;}
draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,2*Math.PI);
ctx.fillStyle="rgba(255,255,255,.85)";ctx.shadowBlur=8;ctx.fill();}}
let stars=[];for(let k=0;k<120;k++)stars.push(new Star());
function anim(){ctx.clearRect(0,0,s.width,s.height);stars.forEach(s=>{s.move();s.draw();});requestAnimationFrame(anim);} anim();
</script>

<!-- ENABLE LOGIN ONLY IF INPUTS ARE FILLED -->
<script>
const username = document.getElementById("username");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");

function toggleLogin() {
    const ok = username.value.trim() !== "" && password.value.trim() !== "";
    loginBtn.disabled = !ok;
    loginBtn.style.opacity = ok ? "1" : "0.6";
}

username.addEventListener("input", toggleLogin);
password.addEventListener("input", toggleLogin);
toggleLogin();
</script>

{% endblock %}
